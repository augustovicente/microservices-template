service:
  name: document
  port: 3000
  logLevel: info

database:
  type: mysql
  host: document_db
  port: 3306
  name: document
  user: admin
  password: admin
  poolSize: 10
  migrationsDir: ./db-migrations

features:
  prometheus: true
  auth: false
  cors: true
  healthCheck: true

cors:
  origins:
    - "*"

messaging:
  enabled: true
  nsqdHost: nsqd
  nsqdHttpPort: 4151
  nsqLookupdHost: nsqlookupd
  nsqLookupdHttpPort: 4161

# ── Document-specific config ──────────────────────────────────────────────
storage:
  provider: local          # local | s3
  local:
    uploadDir: ./uploads
  # s3:
  #   bucket: my-bucket
  #   region: us-east-1
  #   accessKeyId: xxx
  #   secretAccessKey: xxx

upload:
  maxSizeMb: 50
  allowedMimeTypes:
    - image/jpeg
    - image/png
    - image/gif
    - application/pdf
    - application/msword
    - application/vnd.openxmlformats-officedocument.wordprocessingml.document
    - text/plain
