services:
  email_app:
    image: node:20
    volumes:
      - ../../:/project
    working_dir: /project/services/email
    command: npm start
    ports:
      - "3003:3000"
    networks:
      - messaging
      - localprom

  # MailHog — local SMTP testing server with web UI
  mailhog:
    image: mailhog/mailhog
    ports:
      - "8025:8025"    # Web UI
      - "1025:1025"    # SMTP
    networks:
      - messaging
